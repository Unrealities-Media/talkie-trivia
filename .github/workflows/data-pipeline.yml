name: Publish Reviewed Daily Challenges

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: Apply missing future dates after reviewing the preview
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: daily-content-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled writes are staging-only and require an explicit repository opt-in.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_STAGING_SCHEDULE == 'true'
    environment: ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: utils/pipeline
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      RELEASED_CATALOG_SHA256: ${{ vars.RELEASED_CATALOG_SHA256 }}
      APPLY_CHANGES: ${{ inputs.apply || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - name: Validate configuration and released catalog
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$RELEASED_CATALOG_SHA256"
          actual=$(sha256sum ../../src/data/searchIndex.json | cut -d ' ' -f 1)
          test "$actual" = "$RELEASED_CATALOG_SHA256"
      - name: Test pipeline before obtaining credentials
        run: go test ./... && go vet ./...
      - name: Test publication summary disclosure boundary
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_schedule_summary.py'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PIPELINE_SERVICE_ACCOUNT }}
      - name: Preview or publish reviewed challenges
        shell: bash
        run: |
          set -euo pipefail
          args=(-schedule -live -project "$FIREBASE_PROJECT_ID" -horizon-days 30)
          if [ "$APPLY_CHANGES" = "true" ]; then
            args+=(-apply -confirm-project "$FIREBASE_PROJECT_ID")
          fi
          go run . "${args[@]}"
      - name: Create public-safe publication summary
        working-directory: .
        run: python3 scripts/schedule_summary.py utils/data-source/schedule-plan.json utils/data-source/schedule-summary.json
      - name: Save publication summary without future answers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schedule-summary-${{ inputs.environment || 'staging' }}
          path: utils/data-source/schedule-summary.json
          retention-days: 7
          if-no-files-found: error
