name: Unit Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install App Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Type Check (App)
        run: npm run typecheck

      - name: Lint app, backend and tests
        run: npm run lint

      - name: Validate scripts, environments and dependency contracts
        run: npm run test:scripts

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Test publication summary disclosure boundary
        run: python3 -m unittest discover -s scripts -p 'test_schedule_summary.py'

      - name: Audit deployed backend dependencies
        run: npm --prefix functions audit --omit=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run App Tests
        run: npm test -- --watchAll=false --ci --maxWorkers=2 --coverage

      - name: Run Functions Tests
        run: |
          cd functions
          npm test -- --coverage

      - name: Upload App Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-app
          path: coverage/
          retention-days: 5

      - name: Upload Functions Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-functions
          path: functions/coverage/
          retention-days: 5

      - name: Build web app without deployment credentials
        run: npm run build:web
        env:
          APP_VARIANT: development
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'

  browser:
    name: Browser gameplay contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            integration/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix integration ci
          node integration/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify browser isolation guards
        run: npm --prefix integration run test:browser-safety
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .expo/firebase-emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('integration/package-lock.json') }}
      - name: Test desktop and mobile gameplay against isolated emulators
        run: npm --prefix integration run test:browser
        env:
          FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-contract-failure
          path: |
            .expo/browser-results/
            .expo/browser-report/
          retention-days: 3

  pipeline:
    name: Check Go Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: utils/pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate GitHub workflows
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  emulator-contracts:
    name: Firebase rules and transaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            integration/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - name: Install locked dependencies
        run: |
          npm --prefix functions ci
          npm --prefix integration ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .expo/firebase-emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('integration/package-lock.json') }}
      - name: Verify emulator dependency compatibility
        run: npm --prefix integration run test:dependencies
      - name: Test isolated demo project
        run: npm --prefix integration test
        env:
          FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-contract-failure
          path: |
            firebase-debug.log
            firestore-debug.log
          retention-days: 3
