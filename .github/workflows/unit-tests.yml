name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: "npm"

      - name: Install App Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Type Check (App)
        run: npm run typecheck

      - name: Validate environment and release signing contracts
        run: npm run test:config

      - name: Validate dependency security backports
        run: npm run test:dependencies

      - name: Audit deployed backend dependencies
        run: npm --prefix functions audit --omit=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run App Tests
        run: npm test -- --watchAll=false --ci --maxWorkers=2 --coverage

      - name: Run Functions Tests
        run: |
          cd functions
          npm test -- --coverage

      - name: Upload App Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-app
          path: coverage/lcov-report/
          retention-days: 5

      - name: Upload Functions Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-functions
          path: functions/coverage/lcov-report/
          retention-days: 5

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info,./functions/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  pipeline:
    name: Check Go Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utils/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

  emulator-contracts:
    name: Firebase rules and transaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            integration/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - name: Install locked dependencies
        run: |
          npm --prefix functions ci
          npm --prefix integration ci
      - uses: actions/cache@v4
        with:
          path: .expo/firebase-emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('integration/package-lock.json') }}
      - name: Verify emulator dependency compatibility
        run: npm --prefix integration run test:dependencies
      - name: Test isolated demo project
        run: npm --prefix integration test
        env:
          FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-contract-failure
          path: |
            firebase-debug.log
            firestore-debug.log
          retention-days: 3
