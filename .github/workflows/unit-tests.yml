name: Unit Tests

on:
  push:
    # Branches are checked on pull_request; verify the merged result on push.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install App Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Type Check (App)
        run: npm run typecheck

      - name: Lint app, backend and tests
        run: npm run lint

      - name: Validate scripts, environments and dependency contracts
        run: npm run test:scripts

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Test publication summary disclosure boundary
        run: python3 -m unittest discover -s scripts -p 'test_schedule_summary.py'

      - name: Audit deployed backend dependencies
        run: npm --prefix functions audit --omit=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run App Tests
        run: npm test -- --watchAll=false --ci --maxWorkers=2 --coverage

      - name: Run Functions Tests
        run: |
          cd functions
          npm test -- --coverage

      - name: Upload App Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-app
          path: coverage/
          retention-days: 5

      - name: Upload Functions Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-functions
          path: functions/coverage/
          retention-days: 5

      - name: Build web app without deployment credentials
        run: npm run build:web
        env:
          APP_VARIANT: development
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'

  browser:
    name: Browser gameplay contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            integration/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix integration ci
          node integration/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify browser isolation guards
        run: npm --prefix integration run test:browser-safety
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .expo/firebase-emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('integration/package-lock.json') }}
      - name: Test desktop and mobile gameplay against isolated emulators
        run: npm --prefix integration run test:browser
        env:
          FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-contract-failure
          path: |
            .expo/browser-results/
            .expo/browser-report/
          retention-days: 3

  pipeline:
    name: Check Go Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: utils/pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate GitHub workflows
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  emulator-contracts:
    name: Firebase rules and transaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine Firebase contract scope
        id: scope
        run: node scripts/emulator-contract-scope.cjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            integration/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: utils/pipeline/go.mod
          cache-dependency-path: utils/pipeline/go.sum
      - name: Install locked dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          npm --prefix functions ci
          npm --prefix integration ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          path: .expo/firebase-emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('integration/package-lock.json') }}
      - name: Verify emulator dependency compatibility
        if: steps.scope.outputs.run == 'true'
        run: npm --prefix integration run test:dependencies
      - name: Test isolated demo project
        if: steps.scope.outputs.run == 'true'
        run: npm --prefix integration test
        env:
          FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-contract-failure
          path: |
            firebase-debug.log
            firestore-debug.log
          retention-days: 3
