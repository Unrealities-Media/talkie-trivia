name: Native build verification

on:
  # Web beta: expensive native builds run only when explicitly requested.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VARIANT: development
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:config
      - run: npm run native:generate -- android
      - name: Install required Android toolchain
        run: |
          NDK_VERSION=$(node -p 'require("./plugins/withAndroidPageSize.cjs").ndkVersion')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.5" "ndk;$NDK_VERSION" "build-tools;36.0.0"
      - name: Test APK alignment verifier
        run: |
          NDK_VERSION=$(node -p 'require("./plugins/withAndroidPageSize.cjs").ndkVersion')
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" python3 -m unittest discover -s scripts -p 'test_android_page_size.py'
      # Release compiles/bundles the actual JS and native dependencies. No upload
      # credential is provided: the config plugin leaves the artifact unsigned.
      - name: Compile unsigned Android release (ARM64)
        working-directory: android
        # The source build exhausted the generated 512 MiB metaspace and then
        # stopped producing output until the job timeout. Bound concurrency and
        # fail promptly on JVM exhaustion; leave time to upload diagnostics.
        timeout-minutes: 68
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 65m bash gradlew :app:assembleRelease \
            --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+ExitOnOutOfMemoryError' \
            -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../.expo/android-build.log
      - name: Verify packaged 16 KB alignment
        run: |
          NDK_VERSION=$(node -p 'require("./plugins/withAndroidPageSize.cjs").ndkVersion')
          python3 scripts/verify-android-page-size.py android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --readelf "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            --report .expo/android-page-size-report.json
      - name: Retain Android build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-diagnostics
          path: |
            .expo/android-build.log
            android/build/reports/
            .expo/react-native-source/ReactAndroid/build/reports/
            .expo/react-native-source/ReactAndroid/hermes-engine/build/build-hermesc.log
            .expo/android-page-size-report.json
          retention-days: 5

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Xcode and CocoaPods
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version
      - run: npm ci
      - run: npm run native:generate -- ios
      - name: Install native dependencies
        working-directory: ios
        run: pod install
      - name: Compile unsigned iOS simulator release
        run: |
          set -o pipefail
          xcodebuild -workspace ios/TalkieDev.xcworkspace -scheme TalkieDev \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .expo/ios-build \
            -resultBundlePath .expo/ios-build-results.xcresult \
            CODE_SIGNING_ALLOWED=NO build | tee .expo/ios-build.log
      - name: Retain iOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-diagnostics
          path: |
            .expo/ios-build.log
            .expo/ios-build-results.xcresult
          retention-days: 5
